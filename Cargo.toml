[package]
name = "tpa"
version = "0.1.0"
edition = "2021"
authors = ["Andrea Guarracino <aguarracino@tgen.org>"]
description = "TracePoint Alignment (TPA) format for efficient storage and random access of sequence alignments with tracepoints"
license = "MIT"
repository = "https://github.com/AndreaGuarracino/tpa"

[dependencies]
zstd = "0.13"
log = "0.4"
flate2 = "1.1"
env_logger = "0.11"
bgzip = "0.3"
rayon = "1.11"
noodles = { version = "0.100.0", features = ["bgzf"] }

lib_wfa2 = { git = "https://github.com/AndreaGuarracino/lib_wfa2", rev = "787093a7880a26b1b9b25bdb038b899784e01c81" }
tracepoints = { git = "https://github.com/GuarracinoLab/tracepoints", rev = "2aa427e774e66adab6e2a864f2ed2e865ca16f71" }

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "tpa-analyze"
path = "src/bin/tpa-analyze.rs"

[[bin]]
name = "tpa-view"
path = "src/bin/tpa-view.rs"

