[package]
name = "tpa"
version = "0.1.0"
edition = "2021"
authors = ["Andrea Guarracino <aguarracino@tgen.org>"]
description = "TracePoint Alignment (TPA) format for efficient storage and random access of sequence alignments with tracepoints"
license = "MIT"
repository = "https://github.com/AndreaGuarracino/tpa"

[dependencies]
zstd = "0.13"
log = "0.4"
flate2 = "1.1"
env_logger = "0.11"
bgzip = "0.3"
rayon = "1.11"
noodles = { version = "0.100.0", features = ["bgzf"] }

lib_wfa2 = { git = "https://github.com/AndreaGuarracino/lib_wfa2", rev = "de186d445eb0719477a175c30a5022f5872509a1" }
tracepoints = { git = "https://github.com/AndreaGuarracino/tracepoints", rev = "58b8749c4c0a8e4905a6ad0a2ae973b1e16552c6" }

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "tpa-analyze"
path = "src/bin/tpa-analyze.rs"

[[bin]]
name = "tpa-view"
path = "src/bin/tpa-view.rs"

